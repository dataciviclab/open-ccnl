name: ci

on:
  push:
    branches: [main]
    paths:
      - "datasets/**"
      - "compose/**"
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.sql"
      - "**/Makefile"
      - "pyproject.toml"
  pull_request:
    paths:
      - "datasets/**"
      - "compose/**"
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.sql"
      - "**/Makefile"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extras: "dev"
      - run: make test

  detect:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.detect.outputs.dirs }}
      count: ${{ steps.detect.outputs.count }}
      found: ${{ steps.detect.outputs.found }}
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/detect-changed-datasets@main
        id: detect
        with:
          paths: "datasets"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-config:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.found == 'true'
    uses: dataciviclab/.github/.github/workflows/dataset-config-check-reusable.yml@main
    with:
      configs: ${{ needs.detect.outputs.dirs }}
      years: "from-config"
